version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: social_network
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    networks:
      - my_network

networks:
  my_network:
    driver: bridge